name: HomeQuest checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: make test widgets
      - run: npm install --global corepack
      - run: ./scripts/setup-widget-harness.sh
      - run: cd .tools/widget-sandbox && corepack pnpm exec playwright install-deps chromium
      - run: make harness
